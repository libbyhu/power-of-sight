# 用 Docker 開一個 PostgreSQL，給後端的 postgres profile 使用。
# 本機開發不需要這個（預設用 H2）；想模擬正式環境時才開。
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: power_of_sight
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos-local-password
    ports:
      - "5432:5432"
    volumes:
      - pos-db:/var/lib/postgresql/data
volumes:
  pos-db:
