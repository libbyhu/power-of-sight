# 本機開發用。資料存在 backend/.local-data/，不會被 git 上傳。
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./.local-data/pos;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=

# 只給本機用的簽章金鑰。正式環境一定要用 JWT_SECRET 環境變數換掉。
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
